image: docker:29.1.2
services:
  - name: docker:29.1.2-dind
    command: ['--tls=false', '--mtu=1240']
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ''
  DOCKER_HOST: tcp://docker:2375
  DOCKER_REGISTRY: registry.nosi.cv
  DOCKER_PROJECT: igrp
  IMAGE_NAME: igrp-storybook
stages:
  - verify
  - build
  - deploy

# The migration payloads under packages/framework/template-migrator/migrations/
# are a hand-maintained copy of templates/demo-v1. Edit the template without
# authoring a migration and the two diverge silently: apps scaffolded from the
# zip get the change, apps upgraded via the CLI never do.
#
# The same gate runs at the start of `pnpm --filter @igrp/template-migrator
# release`, but only catching it there means the drift is already committed and
# has to be reconciled retroactively (see the several `*-resync` / `*-catchup`
# migrations in the history). Running it per-MR turns those into a one-line
# migration authored alongside the change that caused it.
#
# Needs no registry credentials: the migrator's own dependencies are all public,
# and the filtered install pulls nothing from the @igrp scope.
#
# This job was committed commented-out, and its `changes:` paths still said
# `packages/template-migrator/**/*` — the package actually lives under
# `packages/framework/`, so even uncommented it would never have fired on a
# change to the migrator itself. Both fixed below.
check_template_drift:
  stage: verify
  image: node:22
  services: []
  rules:
    - changes:
        - templates/demo-v1/**/*
        - packages/framework/template-migrator/**/*
      when: always
  before_script:
    # corepack alone is enough — the root package.json `packageManager` field
    # pins the exact pnpm version (with hash), so an explicit `corepack prepare`
    # would only risk disagreeing with it.
    - corepack enable
    - pnpm install --filter @igrp/template-migrator --frozen-lockfile --ignore-scripts
  script:
    - pnpm --filter @igrp/template-migrator typecheck
    - pnpm --filter @igrp/template-migrator test
    - pnpm --filter @igrp/template-migrator check:drift

# The Storybook visual suite is the design system's only UI regression gate — there
# is no root-level unit test suite. It silently died on 2026-06-25 when Storybook
# went to 10.x (`@storybook/test-runner` crashed during setup, so *zero* tests ran
# while the command still looked plausible), and nothing noticed for three months:
# by the time it was fixed, 26 commits across 52 design-system files had landed
# un-snapshotted. Running it per-MR is what stops that recurring.
#
# Runs against `storybook dev`, NOT a static build. The two are not
# interchangeable: next/image emits `color: transparent` under the dev server and
# omits it in a production build, so the Image and PdfViewer stories diff by
# environment (verified — 5 failures against `storybook build`). The committed
# baselines are dev-server output, which is also the workflow documented in the
# package's CLAUDE.md and in .storybook/test-runner.ts. Keep the two in step: if
# this job ever moves to a static build, every baseline has to be regenerated the
# same way.
#
# The image tag must track the `playwright` version in
# packages/design-system-storybook/package.json, or the bundled browsers and the
# client library disagree.
test_storybook:
  stage: verify
  image: mcr.microsoft.com/playwright:v1.63.0-jammy
  services: []
  rules:
    - changes:
        - packages/design-system/**/*
        - packages/design-system-storybook/**/*
      when: always
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
    # Storybook resolves @igrp/igrp-framework-react-design-system through its
    # package "exports", which point at dist/ — gitignored, so absent on a clean
    # checkout and it must be built before Storybook can compile.
    - pnpm --filter @igrp/igrp-framework-react-design-system build
  script:
    - pnpm --filter @igrp/igrp-framework-react-design-system-storybook storybook &
    # Plain poll rather than `npx wait-on`: no extra package to resolve at job time.
    - for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:6006 && break; sleep 5; done
    - curl -sf -o /dev/null http://localhost:6006
    # --ci so a missing baseline fails loudly instead of being written and passed.
    - pnpm --filter @igrp/igrp-framework-react-design-system-storybook test-storybook:ci

build_storybook_image:
  stage: build
  rules:
    - changes:
        - packages/design-system-storybook/*
      when: always
  script:
    - docker login -u "$DOCKER_REGISTRY_USERNAME" -p "$DOCKER_REGISTRY_PASSWORD" "$DOCKER_REGISTRY"
    - docker build -t $DOCKER_REGISTRY/$DOCKER_PROJECT/$IMAGE_NAME -f packages/design-system-storybook/Dockerfile .
    - docker tag $DOCKER_REGISTRY/$DOCKER_PROJECT/$IMAGE_NAME $DOCKER_REGISTRY/$DOCKER_PROJECT/$IMAGE_NAME:$CI_PIPELINE_ID
    - docker push $DOCKER_REGISTRY/$DOCKER_PROJECT/$IMAGE_NAME
    - docker push $DOCKER_REGISTRY/$DOCKER_PROJECT/$IMAGE_NAME:$CI_PIPELINE_ID

deploy_storybook:
  image: gcc:latest
  stage: deploy
  rules:
    - changes:
        - packages/design-system-storybook/*
      when: always
  script:
    - |
      curl -u "$DEPLOY_USER:$DEPLOY_PASSWORD" \
        -X POST \
        -H 'Accept: application/json' \
        -H 'Content-Type: application/json' \
        'https://manager.nosi.cv/v3/project/c-kthdc:p-tn7qs/workloads/deployment:integration-hub:$IMAGE_NAME?action=redeploy'

