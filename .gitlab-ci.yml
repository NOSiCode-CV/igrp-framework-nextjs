image: docker:29.1.2
services:
  - name: docker:29.1.2-dind
    command: ['--tls=false', '--mtu=1240']
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ''
  DOCKER_HOST: tcp://docker:2375
  DOCKER_REGISTRY: registry.nosi.cv
  DOCKER_PROJECT: igrp
  IMAGE_NAME: igrp-storybook
stages:
  - verify
  - build
  - deploy

# The migration payloads under packages/framework/template-migrator/migrations/
# are a hand-maintained copy of templates/demo-v1. Edit the template without
# authoring a migration and the two diverge silently: apps scaffolded from the
# zip get the change, apps upgraded via the CLI never do.
#
# The same gate runs at the start of `pnpm --filter @igrp/template-migrator
# release`, but only catching it there means the drift is already committed and
# has to be reconciled retroactively (see the several `*-resync` / `*-catchup`
# migrations in the history). Running it per-MR turns those into a one-line
# migration authored alongside the change that caused it.
#
# Needs no registry credentials: the migrator's own dependencies are all public,
# and the filtered install pulls nothing from the @igrp scope.
#
# This job was committed commented-out, and its `changes:` paths still said
# `packages/template-migrator/**/*` — the package actually lives under
# `packages/framework/`, so even uncommented it would never have fired on a
# change to the migrator itself. Both fixed below.
check_template_drift:
  stage: verify
  image: node:22
  services: []
  rules:
    - changes:
        - templates/demo-v1/**/*
        - packages/framework/template-migrator/**/*
      when: always
  before_script:
    # corepack alone is enough — the root package.json `packageManager` field
    # pins the exact pnpm version (with hash), so an explicit `corepack prepare`
    # would only risk disagreeing with it.
    - corepack enable
    - pnpm install --filter @igrp/template-migrator --frozen-lockfile --ignore-scripts
  script:
    - pnpm --filter @igrp/template-migrator typecheck
    - pnpm --filter @igrp/template-migrator test
    - pnpm --filter @igrp/template-migrator check:drift

# CLAUDE.md says CI checks the vendored skills against skills-lock.json; this is
# that check. Node built-ins only, so no install.
check_skills_lock:
  stage: verify
  image: node:22
  services: []
  rules:
    - changes:
        - .agents/skills/**/*
        - skills-lock.json
        - scripts/sync-claude-skills.mjs
      when: always
  script:
    - node scripts/sync-claude-skills.mjs --verify-lock

# `lint:i18n` (catalog parity + hardcoded-literal scan) otherwise only ran inside
# the template's local `pnpm build`, and the Dockerfile skips it, so an untranslated
# string or a missing catalog key could reach main without any pipeline noticing.
# The i18n package's own tests and build run first: the check CLI is its build output.
check_i18n:
  stage: verify
  image: node:22
  services: []
  rules:
    - changes:
        - templates/demo-v1/src/**/*
        - templates/demo-v1/package.json
        - packages/framework/next-i18n/**/*
        - packages/design-system/src/**/*
        - packages/framework/next-ui/src/**/*
        - packages/framework/next/src/**/*
        # The CLI's own deps (typescript, the ICU parser) move in the lockfile alone.
        - pnpm-lock.yaml
        - package.json
      when: always
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile --ignore-scripts --filter @igrp/framework-next-i18n --filter @igrp/framework-next-template
  script:
    - pnpm --filter @igrp/framework-next-i18n test
    - pnpm --filter @igrp/framework-next-i18n build
    # Re-link: the `igrp-i18n` bin target (dist/cli.js) didn't exist at the first install, so pnpm skipped the template's shim.
    - pnpm install --frozen-lockfile --ignore-scripts --prefer-offline --filter @igrp/framework-next-i18n --filter @igrp/framework-next-template
    - pnpm --filter @igrp/framework-next-template lint:i18n
    # No hardcoded UI strings in the framework packages either; allowlist non-language literals with `igrp-i18n-ignore`.
    - pnpm lint:i18n:framework

# Each framework package's typecheck, lint and Vitest suite otherwise ran only
# inside its `release` script, so a regression merged into development surfaced
# at publish time. Same full, credential-free install as test_storybook.
# `build:framework` first: packages resolve their workspace dependencies through
# package "exports", which point at the gitignored dist/.
verify_framework:
  stage: verify
  image: node:22
  services: []
  rules:
    - changes:
        - packages/framework/next-auth/**/*
        - packages/framework/next-types/**/*
        - packages/design-system/**/*
        - packages/framework/next-ui/**/*
        - packages/framework/next/**/*
        - packages/framework/next-i18n/**/*
        - templates/demo-v1/src/**/*
        - templates/demo-v1/vitest.config.mts
        # Shared build config (Babel/React Compiler, check-dist).
        - scripts/**/*
        - pnpm-lock.yaml
        - package.json
      when: always
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    - pnpm build:framework
    # `@igrp/framework-next...` = next plus every workspace package it depends on
    # (next-ui, design-system, next-types, next-auth); next-types has no `test`.
    - pnpm --filter "@igrp/framework-next..." --filter @igrp/framework-next-i18n run typecheck
    - pnpm --filter "@igrp/framework-next..." --filter @igrp/framework-next-i18n run lint
    # Coverage is reported (text summary in the job log), not enforced yet. It
    # counts only the files some test imports, so an untested module is invisible.
    - pnpm --filter "@igrp/framework-next..." --filter @igrp/framework-next-i18n run test --coverage --coverage.reporter=text-summary
    # The template's auth and middleware tests run against the framework built above.
    - pnpm --filter @igrp/framework-next-template test --coverage --coverage.reporter=text-summary

# Browser smoke tests: demo-v1 in preview mode under `next dev` (production
# builds refuse the auth bypass), driven by Playwright from packages/e2e. The
# image tag must track the `playwright` version in packages/e2e/package.json.
test_e2e:
  stage: verify
  image: mcr.microsoft.com/playwright:v1.64.1-jammy
  services: []
  rules:
    - changes:
        - packages/framework/**/*
        - packages/design-system/**/*
        - packages/e2e/**/*
        - templates/demo-v1/**/*
        - pnpm-lock.yaml
      when: always
  before_script:
    # This image's Node ships without corepack; --force lets it replace the image's yarn shim.
    - command -v corepack || npm install -g --force corepack
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm build:framework
  script:
    - pnpm test:e2e
  artifacts:
    when: always
    reports:
      junit: packages/e2e/results/junit.xml
    paths:
      - packages/e2e/test-results/
    expire_in: 1 week

# Renders every story and runs its `play` function and a11y check. No HTML
# snapshots: they failed on every class-name change, so the job was red on most
# design-system commits whether or not anything broke. Behaviour is the design
# system's Vitest suite; pixels are Chromatic. The suite once died silently on a
# Storybook major (zero tests ran and the command still passed), so watch the
# test count when upgrading Storybook.
#
# The image tag must track the `playwright` version in
# packages/design-system-storybook/package.json, or the bundled browsers and the
# client library disagree.
test_storybook:
  stage: verify
  image: mcr.microsoft.com/playwright:v1.64.1-jammy
  services: []
  rules:
    - changes:
        - packages/design-system/**/*
        - packages/design-system-storybook/**/*
      when: always
  before_script:
    - command -v corepack || npm install -g --force corepack
    - corepack enable
    - pnpm install --frozen-lockfile
    # Storybook resolves @igrp/igrp-framework-react-design-system through its
    # package "exports", which point at dist/ — gitignored, so absent on a clean
    # checkout and it must be built before Storybook can compile.
    - pnpm --filter @igrp/igrp-framework-react-design-system build
  script:
    - pnpm --filter @igrp/igrp-framework-react-design-system-storybook storybook &
    # Plain poll rather than `npx wait-on`: no extra package to resolve at job time.
    - for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:6006 && break; sleep 5; done
    - curl -sf -o /dev/null http://localhost:6006
    - pnpm --filter @igrp/igrp-framework-react-design-system-storybook test-storybook:ci

build_storybook_image:
  stage: build
  rules:
    # Default branch only: this pushes :latest and redeploys the shared Storybook.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - packages/design-system-storybook/**/*
      when: always
  script:
    - docker login -u "$DOCKER_REGISTRY_USERNAME" -p "$DOCKER_REGISTRY_PASSWORD" "$DOCKER_REGISTRY"
    - docker build -t $DOCKER_REGISTRY/$DOCKER_PROJECT/$IMAGE_NAME -f packages/design-system-storybook/Dockerfile .
    - docker tag $DOCKER_REGISTRY/$DOCKER_PROJECT/$IMAGE_NAME $DOCKER_REGISTRY/$DOCKER_PROJECT/$IMAGE_NAME:$CI_PIPELINE_ID
    - docker push $DOCKER_REGISTRY/$DOCKER_PROJECT/$IMAGE_NAME
    - docker push $DOCKER_REGISTRY/$DOCKER_PROJECT/$IMAGE_NAME:$CI_PIPELINE_ID

deploy_storybook:
  image: gcc:latest
  stage: deploy
  rules:
    # Default branch only: this pushes :latest and redeploys the shared Storybook.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - packages/design-system-storybook/**/*
      when: always
  script:
    - |
      curl -f -u "$DEPLOY_USER:$DEPLOY_PASSWORD" \
        -X POST \
        -H 'Accept: application/json' \
        -H 'Content-Type: application/json' \
        "https://manager.nosi.cv/v3/project/c-kthdc:p-tn7qs/workloads/deployment:integration-hub:$IMAGE_NAME?action=redeploy"

