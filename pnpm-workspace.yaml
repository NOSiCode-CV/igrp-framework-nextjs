packages:
  - packages/**
  - templates/**
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
# Explicit, not inherited: pnpm's built-in 1440 default is non-strict, and
# pnpm/pnpm#14409 means strict must be spelled out too.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - '@igrp/platform-access-management-client-ts@0.2.0-beta.21'
  - '@next/env@15.5.29'
  - '@next/swc-darwin-arm64@15.5.29'
  - '@next/swc-darwin-x64@15.5.29'
  - '@next/swc-linux-arm64-gnu@15.5.29'
  - '@next/swc-linux-arm64-musl@15.5.29'
  - '@next/swc-linux-x64-gnu@15.5.29'
  - '@next/swc-linux-x64-musl@15.5.29'
  - '@next/swc-win32-arm64-msvc@15.5.29'
  - '@next/swc-win32-x64-msvc@15.5.29'
  - next@15.5.29
  - '@igrp/framework-next-ui@0.2.0-beta.14'
  - '@igrp/framework-next@0.2.0-beta.16'
  - '@igrp/igrp-framework-react-design-system@0.2.0-beta.10'
